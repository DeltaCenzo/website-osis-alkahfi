<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#2563eb">
  <title>Halaman Tidak Ditemukan | OSIS SMA Al-Kahfi</title>
  <meta name="robots" content="noindex">
  <style>
    :root{color-scheme:light dark;--blue:#2563eb;--ink:#0f172a;--muted:#64748b;--bg:#f8fafc;--card:#fff;--border:#e2e8f0}
    @media(prefers-color-scheme:dark){:root{--ink:#f8fafc;--muted:#a3b0c2;--bg:#07090e;--card:#111827;--border:#334155}}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top left,rgba(37,99,235,.15),transparent 35%),var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:min(100%,620px);text-align:center;padding:clamp(28px,6vw,52px);border:1px solid var(--border);border-radius:28px;background:color-mix(in srgb,var(--card) 92%,transparent);box-shadow:0 24px 60px rgba(15,23,42,.12)}
    .mark{width:72px;height:72px;margin:0 auto 22px;display:grid;place-items:center;border-radius:22px;background:rgba(37,99,235,.12);color:var(--blue);font-size:30px;font-weight:800}.code{display:block;color:var(--blue);font-size:.78rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}h1{margin:8px 0 10px;font-size:clamp(1.8rem,6vw,2.7rem);line-height:1.1}p{margin:0 auto;color:var(--muted);max-width:450px;line-height:1.65}.actions{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:26px}a{min-height:46px;display:inline-flex;align-items:center;justify-content:center;padding:11px 17px;border-radius:13px;border:1px solid var(--border);color:var(--ink);text-decoration:none;font-weight:750}a.primary{background:var(--blue);border-color:var(--blue);color:white}a:focus-visible{outline:3px solid #f59e0b;outline-offset:3px}@media(max-width:480px){main{border-radius:22px}.actions{display:grid}a{width:100%}}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">404</div>
    <span class="code">Halaman tidak ditemukan</span>
    <h1>Sepertinya kamu tersesat.</h1>
    <p>Alamat yang dibuka tidak tersedia. Kembali ke website OSIS atau langsung menuju kotak aspirasi.</p>
    <div class="actions">
      <a class="primary" href="./index.html">Kembali ke Beranda</a>
      <a href="./index.html#kritik-saran">Buka Aspirasi</a>
    </div>
  </main>
</body>
</html>
